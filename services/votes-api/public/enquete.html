<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enquete</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <h1><a href="/" style="text-decoration:none">← Enquetes</a></h1>
    <p class="sub">Vote e acompanhe o resultado ao vivo</p>
  </header>

  <main>
    <section class="card">
      <div class="topo-enquete">
        <h2 id="titulo">Carregando...</h2>
        <p class="desc" id="descricao"></p>
      </div>
      <div class="meta" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px">
        <span class="badge aberta" id="status">·</span>
        <span class="rodape" id="prazo"></span>
      </div>
    </section>

    <section class="card" id="card-voto">
      <h2>Seu voto</h2>
      <form id="form-voto" autocomplete="off">
        <label>
          CPF
          <input type="text" id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
        </label>

        <div class="opcoes-voto" id="opcoes"></div>

        <button type="submit" class="btn" id="btn-votar">Votar</button>
        <p id="msg" class="msg" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Resultado</h2>
      <p class="total"><span id="total">0</span> <small id="total-label">votos</small></p>
      <p class="rodape" id="fonte"></p>
      <div class="resultado-lista" id="resultado"></div>
    </section>
  </main>

  <script src="/enquete.js"></script>
</body>
</html>
